<!DOCTYPE html>
<html lang="uz"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<title>Maks — Ovozli suhbat</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;background:#05070d;font-family:-apple-system,'Segoe UI',Roboto,sans-serif;color:#e6edf3}
  #c{display:block;width:100vw;height:100vh;touch-action:manipulation}
  .top{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:16px 18px;z-index:5;pointer-events:none}
  .brand{font-size:17px;font-weight:800}.brand b{color:#38bdf8}
  .back{pointer-events:auto;color:#8b949e;font-size:13px;text-decoration:none;background:rgba(22,27,34,.7);
        border:1px solid #30363d;border-radius:20px;padding:6px 14px;backdrop-filter:blur(6px)}
  .back:active{color:#fff}
  .center{position:fixed;left:0;right:0;bottom:0;top:0;display:flex;flex-direction:column;align-items:center;
          justify-content:flex-end;padding-bottom:12vh;pointer-events:none;z-index:4}
  #status{font-size:17px;font-weight:600;letter-spacing:.3px;text-align:center;padding:0 24px;min-height:26px;transition:color .3s;text-shadow:0 2px 12px #000}
  #hint{font-size:12.5px;color:#6e7681;margin-top:8px;text-align:center;padding:0 30px}
  .err{position:fixed;bottom:4vh;left:0;right:0;text-align:center;color:#f85149;font-size:12px;padding:0 24px;z-index:6}
</style></head>
<body>
<canvas id="c"></canvas>
<div class="top">
  <div class="brand">🧠 <b>Maks</b></div>
  <a class="back" href="index.html">🏢 Ofis</a>
</div>
<div class="center">
  <div id="status">Bosing va gapiring</div>
  <div id="hint">Sharga teging — Maks eshitadi</div>
</div>
<div class="err" id="err"></div>
<script type="module">
import { Conversation } from 'https://cdn.jsdelivr.net/npm/@elevenlabs/client/+esm';

// ====== SOZLAMA: backend-proxy manzili (signed URL beradi). Token BU YERDA YO'Q. ======
const CONFIG = { backendUrl: "" };  // masalan: "https://xxxx.trycloudflare.com"

const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const statusEl=document.getElementById('status'),hintEl=document.getElementById('hint'),errEl=document.getElementById('err');
let W,H,DPR=Math.min(devicePixelRatio||1,2),cx,cy;
function resize(){W=innerWidth;H=innerHeight;cx=W/2;cy=H*0.42;cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
addEventListener('resize',resize);resize();

let state='idle'; let energy=0,targetEnergy=0;
const PAL={idle:[56,189,248],connecting:[160,160,170],listening:[63,185,80],speaking:[88,166,255],error:[248,81,73]};
const LABEL={idle:'Bosing va gapiring',connecting:'Ulanyapman…',listening:'Tinglayapman…',speaking:'Maks javob beryapti…',error:'Xatolik'};
const HINT={idle:'Sharga teging — Maks bilan gaplashing',connecting:'Bir lahza…',listening:'Gapiring…',speaking:'Tugatish uchun qayta bosing',error:''};
function setState(s){state=s;statusEl.textContent=LABEL[s];hintEl.textContent=HINT[s]||'';const c=PAL[s];statusEl.style.color=`rgb(${c[0]},${c[1]},${c[2]})`;}

const N=520,pts=[];
for(let i=0;i<N;i++){const y=1-(i/(N-1))*2;const r=Math.sqrt(1-y*y);const th=Math.PI*(3-Math.sqrt(5))*i;pts.push({x:Math.cos(th)*r,y,z:Math.sin(th)*r});}
function draw(t){
  ctx.clearRect(0,0,W,H);
  const col=PAL[state],base=Math.min(W,H)*0.17;
  energy+=(targetEnergy-energy)*0.14;
  const breathe=0.5+0.5*Math.sin(t*0.0018),pulse=1+0.12*breathe+0.55*energy,R=base*pulse;
  const g=ctx.createRadialGradient(cx,cy,R*0.2,cx,cy,R*2.4);
  g.addColorStop(0,`rgba(${col[0]},${col[1]},${col[2]},${0.18+0.22*energy})`);g.addColorStop(1,`rgba(${col[0]},${col[1]},${col[2]},0)`);
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  const ry=t*0.0004,rx=Math.sin(t*0.0003)*0.5,cy1=Math.cos(ry),sy=Math.sin(ry),cx1=Math.cos(rx),sx=Math.sin(rx),proj=[];
  for(const p of pts){let x=p.x*cy1-p.z*sy,z=p.x*sy+p.z*cy1,y=p.y,y2=y*cx1-z*sx,z2=y*sx+z*cx1;const pe=1/(1.8-z2*0.6);proj.push({sx:cx+x*R*pe,sy:cy+y2*R*pe,z:z2});}
  proj.sort((a,b)=>a.z-b.z);
  for(const p of proj){const d=(p.z+1)/2,alpha=0.15+0.85*d,size=(1.1+2.0*d)*(0.9+0.5*energy);ctx.beginPath();ctx.fillStyle=`rgba(${col[0]},${col[1]},${col[2]},${alpha})`;ctx.arc(p.sx,p.sy,size,0,7);ctx.fill();}
  const cg=ctx.createRadialGradient(cx,cy,0,cx,cy,R*0.5);cg.addColorStop(0,`rgba(255,255,255,${0.5+0.4*energy})`);cg.addColorStop(1,`rgba(${col[0]},${col[1]},${col[2]},0)`);
  ctx.beginPath();ctx.fillStyle=cg;ctx.arc(cx,cy,R*0.5,0,7);ctx.fill();
  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);

// ====== ElevenLabs Conversational AI ======
let conv=null;
function energyLoop(){
  if(!conv){targetEnergy=0;return;}
  try{
    if(state==='speaking'&&conv.getOutputVolume) targetEnergy=Math.min(1,conv.getOutputVolume()*1.4);
    else if(conv.getInputVolume) targetEnergy=Math.min(1,conv.getInputVolume()*2.2);
  }catch(e){}
  requestAnimationFrame(energyLoop);
}
async function startConv(){
  if(!CONFIG.backendUrl){ setState('error'); errEl.textContent='Backend hali ulanmagan (CONFIG.backendUrl bo\'sh)'; setTimeout(()=>{errEl.textContent='';setState('idle');},3000); return; }
  setState('connecting'); errEl.textContent='';
  try{
    const r=await fetch(CONFIG.backendUrl.replace(/\/$/,'')+'/signed-url');
    if(!r.ok){const j=await r.json().catch(()=>({}));throw new Error(j.error||('backend '+r.status));}
    const {signedUrl}=await r.json();
    conv=await Conversation.startSession({
      signedUrl,
      onModeChange:({mode})=>setState(mode==='speaking'?'speaking':'listening'),
      onStatusChange:({status})=>{ if(status==='disconnected'){conv=null;setState('idle');} },
      onError:(e)=>{ setState('error'); errEl.textContent=(e&&e.message)||'Ulanish xatosi'; }
    });
    requestAnimationFrame(energyLoop);
  }catch(e){ setState('error'); errEl.textContent=e.message; conv=null; setTimeout(()=>{errEl.textContent='';setState('idle');},3500); }
}
async function endConv(){ try{ if(conv) await conv.endSession(); }catch(e){} conv=null; targetEnergy=0; setState('idle'); }

cv.addEventListener('click',()=>{ if(state==='idle'||state==='error') startConv(); else endConv(); });

try{const tg=window.Telegram&&window.Telegram.WebApp;if(tg){tg.ready();tg.expand();if(tg.setHeaderColor)tg.setHeaderColor('#05070d');if(tg.setBackgroundColor)tg.setBackgroundColor('#05070d');}}catch(e){}
setState('idle');
</script>
</body></html>
